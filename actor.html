<!DOCTYPE html>
<html>
<head>
    <!-- Part 2: Descriptive title and header -->
    <title>Actors by Obora Stephen Efurhievwe</title>
    
</head>
<body>
    <h1>Actors by Obora Stephen Efurhievwe</h1>

    <!-- Part 3: Actor Form and result display -->
    <div>
        <label>Peter Pan <input type="password" id="secretActor" value="Robin Williams"></label><br>
        <label>Who is the actor <input type="text" id="guessInput"></label><br>
        <button onclick="checkActor()">Check the guess</button>
        <p id="resultDisplay"></p>
    </div>

    <!-- Part 4: Image Switcher using your local images -->
    <div>
        <img src="eclair.jpg" id="foodImage" width="150" height="150" onclick="updatePic()">
    </div>

    <script>
        // Part 3: Global variables for correct and incorrect counts
        let correct = 0;
        let notCorrect = 0;

        function checkActor() {
            let secret = document.getElementById("secretActor").value;
            let guess = document.getElementById("guessInput").value;

            if (guess === secret) {
                correct++;
                alert("That's right");
            } else {
                notCorrect++;
                alert("Better luck next time");
            }

            document.getElementById("resultDisplay").innerHTML = "Correct: " + correct + ", Not Correct: " + notCorrect;
        }

        // Part 4: Global variable and switch function for images
        let usePic = 1;

        function updatePic() {
            let imgElement = document.getElementById("foodImage");
            switch (usePic) {
                case 1:
                    imgElement.src = "eclair.jpg";
                    usePic = 2;
                    break;
                case 2:
                    imgElement.src = "falafel.jpg";
                    usePic = 3;
                    break;
                case 3:
                    imgElement.src = "ramen.jpg";
                    usePic = 1;
                    break;
            }
        }
    </script>

</body>
</html>
