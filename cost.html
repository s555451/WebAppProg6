<!DOCTYPE html>
<html>
<head>
    <title>Sales Computation - Obora Efurhievwe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-4">

    <h2>Obora Efurhievwe sales computation</h2>

    <form class="mb-4">
        <div class="mb-3">
            <label for="numberItems" class="form-label">Enter number items</label>
            <input type="number" class="form-control" id="numberItems" value="1">
        </div>

        <div class="mb-3">
            <label for="itemCost" class="form-label">Enter the cost of one item</label>
            <input type="number" class="form-control" id="itemCost" value="20.0">
        </div>

        <div class="mb-3">
            <label for="numberForDiscount" class="form-label">Enter number to get discount</label>
            <input type="number" class="form-control" id="numberForDiscount" value="10">
        </div>

        <div class="mb-3">
            <label for="DiscountRate" class="form-label">Enter the discount rate</label>
            <input type="number" class="form-control" id="DiscountRate" value="0.15" step="0.01">
        </div>

        <input type="button" class="btn btn-primary" onclick="doDiscount()" value="Show costs">
    </form>

    <div id="result" class="alert alert-info">Costs will appear here.</div>

    <script>
        function doDiscount() {
            let numItems = parseInt(document.getElementById("numberItems").value);
            let costPerItem = parseFloat(document.getElementById("itemCost").value);
            let discountAt = parseInt(document.getElementById("numberForDiscount").value);
            let discountRate = parseFloat(document.getElementById("DiscountRate").value);

            let costs = "";

            for (let i = 1; i <= 5; i++) {
                let checkCount = numItems * i;
                let totalCost = 0;

                if (checkCount <= discountAt) {
                    totalCost = checkCount * costPerItem;
                } else {
                    let normalCount = discountAt;
                    let discountedCount = checkCount - discountAt;
                    totalCost = (normalCount * costPerItem) + (discountedCount * costPerItem * (1 - discountRate));
                }

                costs += "checkCount " + checkCount + " is " + totalCost + "; ";
            }

            document.getElementById("result").innerHTML = "Costs are: " + costs;
        }
    </script>

</body>
</html>
