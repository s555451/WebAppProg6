<!DOCTYPE html>
<html>
<head>
    <!-- Part 5: Title and header -->
    <title>Obora Stephen Efurhievwe sales computation</title>
</head>
<body>
    <h1>Obora Stephen Efurhievwe sales computation</h1>

    <!-- Part 5: Four input elements for pricing and discounts -->
    <div>
        <label>Enter number items <input type="number" id="numberItems" value="1"></label><br>
        <label>Enter the cost of one item <input type="number" id="itemCost" value="20.0"></label><br>
        <label>Enter number to get discount <input type="number" id="numberForDiscount" value="10"></label><br>
        <label>Enter the discount rate <input type="number" id="discountRate" value="0.15"></label><br>
        <button onclick="doDiscount()">Show costs</button>
    </div>

    <!-- Part 6: Radio button group for operations -->
    <div>
        <form>
            <label><input type="radio" name="op" value="mul" onclick="chooseOp()"> product</label>
            <label><input type="radio" name="op" value="add" onclick="chooseOp()"> sum</label>
            <label><input type="radio" name="op" value="div" onclick="chooseOp()"> divide</label>
        </form>
    </div>

    <p id="costResult"></p>

    <script>
        // Part 5: Looping computation function
        function doDiscount() {
            let num = parseFloat(document.getElementById("numberItems").value);
            let cost = parseFloat(document.getElementById("itemCost").value);
            let discountAt = parseFloat(document.getElementById("numberForDiscount").value);
            let rate = parseFloat(document.getElementById("discountRate").value);
            
            let costs = "";

            for (let i = 1; i <= 5; i++) {
                let checkCount = num * i;
                let computedCost = 0;

                if (checkCount <= discountAt) {
                    computedCost = checkCount * cost;
                } else {
                    let normalPart = discountAt * cost;
                    let discountedPart = (checkCount - discountAt) * cost * (1 - rate);
                    computedCost = normalPart + discountedPart;
                }
                costs += "checkCount " + checkCount + " is " + computedCost + "; ";
            }

            document.getElementById("costResult").innerHTML = "Costs are: " + costs;
        }

        // Part 6: Radio button calculation function
        function chooseOp() {
            let count = parseFloat(document.getElementById("numberItems").value);
            let discountAt = parseFloat(document.getElementById("numberForDiscount").value);
            let radios = document.getElementsByName("op");
            let selectedOp = "";

            for (let r of radios) {
                if (r.checked) {
                    selectedOp = r.value;
                    break;
                }
            }

            let resultVal = 0;
            let opText = "";

            if (selectedOp === "mul") {
                resultVal = count * discountAt;
                opText = " times ";
            } else if (selectedOp === "add") {
                resultVal = count + discountAt;
                opText = " plus ";
            } else if (selectedOp === "div") {
                resultVal = count / discountAt;
                opText = " divided by ";
            }

            document.getElementById("costResult").innerHTML = count + opText + discountAt + " is " + resultVal;
        }
    </script>
    
</body>
</html>
