<!DOCTYPE html>
<html>
<head>
    <title>Obora Stephen Efurhievwe meal planner</title>
</head>
<body>
    <h1>Obora Stephen Efurhievwe meal planner</h1>

    <!-- Part 7: Checkbox Form -->
    <div>
        <form>
            <label><input type="checkbox" id="breakfast" value="True"> Breakfast</label>
            <label><input type="checkbox" id="lunch" value="False"> Lunch</label>
            <label><input type="checkbox" id="dinner" value="True"> Dinner</label>
            <br>
            <button type="button" onclick="choices()">Meal Plan Choices</button>
        </form>
    </div>

    <!-- Part 8: Cuisine & Beverage Form -->
    <div>
        <form>
            <label>Enter cuisine type <input type="text" id="cuisineType" value="Italian"></label><br>
            <label>Enter beverage choice <input type="text" id="beverageChoice" value="water"></label><br>
            <button type="button" onclick="updateMeal()">Update the meal plan</button>
        </form>
    </div>

    <p id="mealResult"></p>

    <script>
        let my_meal_plan = {};

        function choices() {
            my_meal_plan = {};
            my_meal_plan.breakfast = document.getElementById("breakfast").checked;
            my_meal_plan.lunch = document.getElementById("lunch").checked;
            my_meal_plan.dinner = document.getElementById("dinner").checked;

            document.getElementById("mealResult").innerHTML = JSON.stringify(my_meal_plan);
        }

        function updateMeal() {
            my_meal_plan["cuisine"] = document.getElementById("cuisineType").value;
            my_meal_plan["beverage"] = document.getElementById("beverageChoice").value;

            document.getElementById("mealResult").innerHTML = JSON.stringify(my_meal_plan);
        }
    </script>
    
</body>
</html>
