<!DOCTYPE html>
<html>
<head>
    <title>Meal Planner - Obora Efurhievwe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container my-4">

    <h2>Obora Efurhievwe meal planner</h2>

    <form class="mb-4">
        <div class="mb-3">
            <label class="form-label">Select Meal Type:</label><br>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="mealChoice" id="meal1" value="Breakfast" checked onclick="chooseMeal()">
                <label class="form-check-label" for="meal1">Breakfast ($5.00)</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="mealChoice" id="meal2" value="Lunch" onclick="chooseMeal()">
                <label class="form-check-label" for="meal2">Lunch ($10.00)</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="mealChoice" id="meal3" value="Dinner" onclick="chooseMeal()">
                <label class="form-check-label" for="meal3">Dinner ($15.00)</label>
            </div>
        </div>
    </form>

    <div id="mealResult" class="alert alert-success">Select a meal to see details.</div>

    <script>
        // Meal planner object with prices and descriptions
        let mealData = {
            "Breakfast": { price: 5.00, desc: "Pancakes, eggs, and coffee." },
            "Lunch": { price: 10.00, desc: "Burger, fries, and a drink." },
            "Dinner": { price: 15.00, desc: "Steak, potatoes, and vegetables." }
        };

        function chooseMeal() {
            let radios = document.getElementsByName("mealChoice");
            let selectedMeal = "";

            for (let i = 0; i < radios.length; i++) {
                if (radios[i].checked) {
                    selectedMeal = radios[i].value;
                    break;
                }
            }

            let mealInfo = mealData[selectedMeal];
            document.getElementById("mealResult").innerHTML = 
                "You chose <strong>" + selectedMeal + "</strong>. Price: $" + mealInfo.price.toFixed(2) + ". Details: " + mealInfo.desc;
        }
    </script>

</body>
</html>
